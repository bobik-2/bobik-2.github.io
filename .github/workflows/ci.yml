name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npx vitest run
      - name: Przeglądarki Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright
        run: npx playwright test
      - name: Odtwarzalność opublikowanych plików
        run: |
          node scripts/build.mjs /tmp/build-a
          node scripts/build.mjs /tmp/build-b
          diff /tmp/build-a/SHA256SUMS /tmp/build-b/SHA256SUMS
          cat /tmp/build-a/SHA256SUMS
      - name: Build do publikacji
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/build.mjs dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # Publikacja na https://bobik-2.github.io — tylko z main, po zielonym `test`.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
