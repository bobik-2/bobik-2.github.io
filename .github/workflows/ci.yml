name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ponowny deploy z main (np. po wypchnięciu taga, gdy merge już się opublikował).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Build składa dist/ z podpisanych tagów v* (rozstrzygnięcie 12): potrzebna cała historia.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npx vitest run
      - name: Przeglądarki Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright
        run: npx playwright test
      - name: Wydane wersje i odtwarzalność (podpisy tagów, releases/*.sha256)
        run: |
          node scripts/build.mjs /tmp/build-a
          node scripts/build.mjs /tmp/build-b
          diff /tmp/build-a/SHA256SUMS /tmp/build-b/SHA256SUMS
          cat /tmp/build-a/SHA256SUMS

  # Build do publikacji w osobnym jobie (końcowy przegląd, I-1): świeży checkout, bez npm ci i bez
  # cache'u npm — kod z node_modules (Vitest, Playwright i zależności przechodnie) nie ma dostępu do
  # workspace'u, z którego powstaje artefakt Pages. Skrypty builda używają tylko modułów Node.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Bez automatycznego cache'u menedżera pakietów (setup-node ≥ 5): build nie dotyka npm.
          package-manager-cache: false
      - name: Build z podpisanych tagów
        run: node scripts/build.mjs dist && cat dist/SHA256SUMS
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # Publikacja na https://bobik-2.github.io — tylko z main (polityka środowiska github-pages), po zielonych `test` i `build`.
  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
